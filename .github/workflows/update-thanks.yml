name: Update teacher thanks screen

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          start = s.find('function showTeacherThanks(')
          end = s.find('function playThanksSound()', start)
          if start < 0 or end < 0:
              raise SystemExit('showTeacherThanks function not found')
          fn = s[start:end]
          if 'thanksCountdown">10' in fn and 'thanksVoteView' in fn:
              print('Already updated')
              raise SystemExit(0)

          fn = fn.replace('سيتم إغلاق الصفحة تلقائيًا خلال <b id="thanksCountdown">5</b> ثوانٍ', 'ستنتقلين إلى ملخص التصويت خلال <b id="thanksCountdown">10</b> ثوانٍ')
          fn = fn.replace('إغلاق الآن', 'الانتقال إلى ملخص التصويت')
          fn = fn.replace('إذا منع المتصفح الإغلاق التلقائي، اضغطي «إغلاق الآن» للعودة.', 'بعد الانتقال سيبقى ملخص التصويت ظاهرًا ويمكنكِ اختيار «إعادة الرصد».')
          fn = fn.replace('let left=5;', 'let left=10;')
          fn = fn.replace('if(left<=0){clearInterval(timer);close();}', 'if(left<=0){clearInterval(timer);close();}')
          old_close = '''const close=()=>{
    clearInterval(timer);
    try{window.close()}catch{}
    setTimeout(()=>{
      const b=document.getElementById("teacherThanksOverlay");
      if(b){const h=document.getElementById("closeThanksHint");if(h)h.style.display="block";}
    },500);
  };'''
          new_close = '''const close=()=>{
    clearInterval(timer);
    const b=document.getElementById("teacherThanksOverlay");
    if(!b)return;
    const pvTotals=teacherVoteTotals(principalVotesToday());
    const voteSummary=pvTotals.length?pvTotals.map((t,i)=>`<div style="display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #eef3f1"><span style="font-weight:800;min-width:30px">${i<3?["🥇","🥈","🥉"][i]:i+1}</span><span style="flex:1;font-weight:700">${esc(t[0])}</span><b style="color:#0f766e">${t[1]} نقطة</b></div>`).join(""):"<div style=\"color:#71808c;font-size:13px\">لا توجد تصويتات للمديرة اليوم بعد.</div>";
    b.innerHTML=`<div style="position:fixed;inset:0;z-index:99999;background:rgba(8,31,49,.62);backdrop-filter:blur(7px);display:flex;align-items:center;justify-content:center;padding:16px;direction:rtl"><div style="width:min(620px,100%);max-height:92vh;overflow:auto;background:linear-gradient(145deg,#ffffff,#f4fbf8);border:1px solid #d7eee6;border-radius:28px;padding:28px 20px;text-align:center;box-shadow:0 25px 70px rgba(0,0,0,.25)"><div style="font-size:46px">⭐</div><div style="font-size:25px;font-weight:800;color:#0f766e">ملخص التصويت</div><div style="font-size:13px;color:#64748b;margin:6px 0 16px">نتائج تصويت المديرة للمعلمات اليوم</div><div style="background:#fff;border:1px solid #dcece6;border-radius:16px;padding:14px;text-align:right">${voteSummary}</div><button id="redoScanBtn" style="margin-top:16px;width:100%;min-height:52px;border:0;border-radius:14px;background:linear-gradient(135deg,#0d9488,#0b7d72);color:#fff;font-size:17px;font-weight:800;cursor:pointer">🔄 إعادة الرصد</button></div></div>`;
    document.getElementById("redoScanBtn")?.addEventListener("click",()=>{
      b.remove();
      route="scan";
      render(false);
      setTimeout(()=>document.querySelector('#teacher')?.focus(),80);
    });
  };'''
          if old_close not in fn:
              raise SystemExit('close function pattern not found')
          fn = fn.replace(old_close, new_close)
          s = s[:start] + fn + s[end:]
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Set 10-second thanks screen and voting summary"
          git push
      - name: Remove one-time workflow
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/update-thanks.yml || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Remove one-time update workflow"
          git push
