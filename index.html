async function pull(silent=true){
  if(!configured())return;
  const url=SCRIPT_URL+"?action=bootstrap&_="+Date.now();
  let lastError="تعذر تحميل بيانات الفصول والطالبات";
  for(let attempt=1;attempt<=3;attempt++){
    try{
      const controller=new AbortController();
      const timer=setTimeout(()=>controller.abort(),12000);
      const r=await fetch(url,{cache:"no-store",redirect:"follow",credentials:"omit",signal:controller.signal});
      clearTimeout(timer);
      if(!r.ok)throw new Error("HTTP "+r.status);
      const x=await r.json();
      if(x.ok===false)throw new Error(x.error||"تعذر الاتصال بمصدر البيانات");
      state.classes=Array.isArray(x.classes)?x.classes:[];
      state.students=Array.isArray(x.students)?x.students:[];
      state.staff=Array.isArray(x.staff)?x.staff:[];
      const serverAtt=Array.isArray(x.attendance)?x.attendance:[];
      const pendingLocal=(state.attendance||[]).filter(a=>a.pending&&!serverAtt.some(y=>y.id===a.id));
      state.attendance=[...serverAtt,...pendingLocal];
      state.teacherNames=Array.isArray(x.teacherNames)?x.teacherNames:[];
      state.behaviorConfig=Array.isArray(x.behaviorConfig)?x.behaviorConfig:(state.behaviorConfig||[]);
      state.principalVoteWeight=Number(x.principalVoteWeight??state.principalVoteWeight??2)||2;
      const serverPV=Array.isArray(x.principalVotes)?x.principalVotes:[];const pendingPV=(state.principalVotes||[]).filter(v=>v.pending&&!serverPV.some(y=>String(y.id)===String(v.id)));state.principalVotes=[...serverPV,...pendingPV];
      BEHAVIORS=(state.behaviorConfig.length?state.behaviorConfig:DEFAULT_BEHAVIORS.map((name,i)=>({id:"B"+i,name,weight:25}))).map(x=>typeof x==="string"?x:x.name).filter(Boolean);
      const fp=dataFingerprint();
      const changed=fp!==lastFingerprint;
      lastFingerprint=fp;
      saveLocal();
      if(changed||!silent)render(false);
      if(!silent)toast("تم تحديث الفصول والطالبات بنجاح");
      return true;
    }catch(e){
      lastError=e?.name==="AbortError"?"انتهت مهلة الاتصال بمصدر البيانات":(e?.message||lastError);
      if(attempt<3)await new Promise(res=>setTimeout(res,700*attempt));

  return false;

function staffDisplayValue(value, fallback="—"){
  if(value===null||value===undefined||value==="")return fallback;
  if(typeof value==="string"||typeof value==="number"||typeof value==="boolean")return String(value);
  if(Array.isArray(value))return value.map(v=>staffDisplayValue(v,"")).filter(Boolean).join("، ")||fallback;
  if(typeof value==="object"){
    const preferred=["name","label","value","username","id"];
    for(const k of preferred){if(value[k]!==undefined&&value[k]!==null&&String(value[k]).trim()!=="")return staffDisplayValue(value[k],fallback)}
    return fallback;
  }
  return fallback;
}
function staffClassDisplay(value){
  if(value==="*")return "كل الفصول";
  const raw=Array.isArray(value)?value:(typeof value==="string"?value.split(","):[value]);
  const ids=raw.flatMap(v=>{
    if(v&&typeof v==="object")return [v.id??v.classId??v.name??""];
    return [v];
  }).map(v=>String(v??"").trim()).filter(Boolean);
  return ids.map(id=>state.classes.find(c=>String(c.id)===id)?.name||id).join("، ")||"—";
}

  }).join("")||`<tr><td colspan="5" class="muted">لا توجد حسابات إدارية مكتملة.</td></tr>`}</tbody></table></section><section class="card"><div class="row between"><h3>أسماء المعلمات للاقتراح</h3><button class="btn" onclick="addTeacherName()">إضافة اسم</button></div><div class="chips">${state.teacherNames.map(x=>`<span class="chip">${esc(staffDisplayValue(x?.name??x))} <b onclick="deleteTeacherName('${esc(staffDisplayValue(x?.name??x,""))}')">×</b></span>`).join("")||`<span class="muted">لا توجد أسماء بعد.</span>`}</div></section>`}

function saveStaff(){const classes=[...document.querySelectorAll('#classchips .sel')].map(x=>x.dataset.id),s={id:uid('ST'),name:$('#stname').value.trim(),role:$('#strole').value.trim()||'إدارية',username:$('#stuser').value.trim(),password:$('#stpass').value,classes:classes.join(',')};if(!s.name||!s.username||!s.password){toast('أكملي بيانات الحساب');return}if(state.staff.some(x=>x.username===s.username)){toast('اسم المستخدم مستخدم مسبقاً');return}state.staff.push(s);saveLocal();push('saveStaff',s);closeModal();render();toast('تم إنشاء الحساب')}

function renderReports(){const d=new Date(today()+"T00:00:00"),from=new Date(d);from.setDate(d.getDate()-6);return `<section class="card"><h2>التقارير والتحليلات</h2><p class="muted">تقارير أسبوعية وشهرية ومخصصة مع رسوم بيانية، Excel وHTML وطباعة PDF.</p><div class="grid g4"><div class="field"><label>الفترة</label><select id="reportPeriod"><option value="week">أسبوعي</option><option value="month">شهري</option><option value="custom">مخصص</option></select></div><div class="field"><label>من</label><input id="reportFrom" type="date" value="${from.toISOString().slice(0,10)}"></div><div class="field"><label>إلى</label><input id="reportTo" type="date" value="${today()}"></div><div class="field"><label>الفصل</label><select id="reportClass"><option value="">كل الفصول</option>${state.classes.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join("")}</select></div></div><div class="row"><button class="btn primary" onclick="setReportPeriod('week')">الأسبوع الحالي</button><button class="btn" onclick="setReportPeriod('month')">الشهر الحالي</button><button class="btn" onclick="buildReportPreview()">عرض التقرير</button><button class="btn navy" onclick="exportCurrentExcel()">Excel</button><button class="btn" onclick="printCurrentReport()">PDF / طباعة</button><button class="btn" onclick="exportCurrentHTML()">HTML</button></div></section><section class="grid g2" style="margin-bottom:18px"><section class="card"><div class="row between"><div><h3>📊 توزيع عناصر السلوك الإيجابي</h3><p class="muted">توزيع عمليات الرصد حسب عناصر السلوك خلال الفترة المحددة.</p></div><span class="pill">حسب التقرير</span></div><div class="chartbox" style="height:320px"><canvas id="reportBehaviorOverviewChart"></canvas></div></section><section class="card"><div class="row between"><div><h3>🏫 الرصد حسب الفصول</h3><p class="muted">عدد عمليات الرصد اليوم في كل فصل.</p></div><span class="pill">اليوم</span></div><div class="chartbox" style="height:320px"><canvas id="classChart"></canvas></div></section> function setReportPeriod(type){const d=new Date(today()+"T00:00:00"),from=new Date(d);if(type==='month')from.setDate(1);else from.setDate(d.getDate()-6);$("#reportFrom").value=from.toISOString().slice(0,10);$("#reportTo").value=today();$("#reportPeriod").value=type;buildReportPreview()}

function pieGradient(counts,labels){const total=Math.max(1,counts.reduce((s,v)=>s+v,0));let acc=0;const stops=counts.map((v,i)=>{const from=acc/total*360;acc+=v;const to=acc/total*360;return `${CHART_PALETTE[i%CHART_PALETTE.length]} ${from}deg ${to}deg`}).join(",");return stops}
function pieLegendHTML(counts,labels){const total=Math.max(1,counts.reduce((s,v)=>s+v,0));return labels.map((lb,i)=>`<div class="legend-row"><span class="legend-dot" style="background:${CHART_PALETTE[i%CHART_PALETTE.length]}"></span><span>${esc(lb)}</span><b>${counts[i]} (${Math.round(counts[i]/total*100)}%)</b></div>`).join("")}
function reportBarSVG(counts,names){const W=900,H=330,left=70,right=30,top=28,plotW=W-left-right,plotH=210,max=Math.max(1,...counts),n=Math.max(1,counts.length),slot=plotW/n,barW=Math.min(72,slot*.58);const bars=counts.map((v,i)=>{const h=Math.max(v?8:0,Math.round(v/max*plotH)),x=left+i*slot+(slot-barW)/2,y=top+plotH-h,fill=CHART_PALETTE[i%CHART_PALETTE.length];return `<rect x="${x}" y="${y}" width="${barW}" height="${h}" rx="8" fill="${fill}"/><text x="${x+barW/2}" y="${Math.max(18,y-8)}" text-anchor="middle" font-size="14" font-weight="800" fill="#102a43">${v}</text><text x="${x+barW/2}" y="${top+plotH+28}" text-anchor="middle" font-size="12" font-weight="700" fill="#102a43">${esc(names[i]||"")}</text>`}).join("");return `<svg class="report-chart-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="رسم بياني لأعداد عناصر السلوك"><line x1="${left}" y1="${top+plotH}" x2="${W-right}" y2="${top+plotH}" stroke="#cbd5df" stroke-width="2"/>${bars}</svg>`}
function reportPieSVG(counts){const total=Math.max(1,counts.reduce((s,v)=>s+v,0)),r=86,circ=2*Math.PI*r;let offset=0;const segs=counts.map((v,i)=>{const len=circ*(v/total),dash=`${len} ${circ-len}`,off=-offset;offset+=len;return `<circle cx="110" cy="110" r="${r}" fill="none" stroke="${CHART_PALETTE[i%CHART_PALETTE.length]}" stroke-width="42" stroke-dasharray="${dash}" stroke-dashoffset="${off}" transform="rotate(-90 110 110)"/>`}).join("");return `<svg class="report-pie-chart-svg" viewBox="0 0 220 220" role="img" aria-label="التوزيع النسبي لعناصر السلوك"><circle cx="110" cy="110" r="${r}" fill="none" stroke="#eef2f5" stroke-width="42"/>${segs}<circle cx="110" cy="110" r="53" fill="#fff"/><text x="110" y="105" text-anchor="middle" font-size="12" font-weight="700" fill="#64748b">إجمالي</text><text x="110" y="128" text-anchor="middle" font-size="22" font-weight="800" fill="#102a43">${total}</text></svg>`}
function reportHTMLCurrent(){const f=getReportFilter(),rows=reportRowsForCurrent(),counts=BEHAVIORS.map(b=>rows.filter(x=>hasBehavior(x,b)).length),max=Math.max(1,...counts),names=behaviorNames();return `<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"><title>تقرير تعزيز السلوك الإيجابي</title><style>body{font-family:Cairo,Arial,sans-serif;color:#102a43;margin:0}main{max-width:1100px;margin:auto;padding:28px}.head{text-align:center;border-bottom:3px solid #0f766e;padding-bottom:16px}.head h1{font-size:30px}.moe-head{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:12px}.moe-lines{text-align:${'right'}}.moe-lines div{font-weight:800;font-size:14px;line-height:1.7;color:#0f2942}.moe-lines div:first-child{font-size:16px;color:#0f766e}.class-report-card{margin:18px auto 10px;max-width:760px;border:1px solid #cfe1e7;border-radius:14px;padding:12px 18px;background:#f4fbfa;display:flex;justify-content:space-between;align-items:center;gap:15px;font-weight:700}.class-report-card span{color:#64748b;font-size:13px}.class-report-card b{color:#0f766e;font-size:18px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{border:1px solid #dbe4ec;border-radius:14px;padding:12px;text-align:center}.num{font-size:25px;font-weight:800;color:#0f766e}.report-svg-chart{width:100%;margin:25px 0}.report-chart-svg{width:100%;height:auto;display:block;overflow:visible}.charts-row{display:flex;gap:30px;align-items:center;justify-content:center;flex-wrap:wrap;margin:25px 0}.pie-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center}.report-pie-svg{width:220px;height:220px}.report-pie-chart-svg{width:220px;height:220px;display:block}.legend-row{display:flex;align-items:center;gap:8px;font-size:13px;margin:6px 0}.legend-dot{width:12px;height:12px;border-radius:50%;flex:none}table{width:100%;border-collapse:collapse;margin-top:20px}th,td{border:1px solid #dbe4ec;padding:8px}th{background:#102a43;color:#fff}.teacher-report-chart{max-width:760px;margin:20px auto}.teacher-bar{margin:12px 0}.teacher-bar-head{display:flex;justify-content:space-between;gap:15px;font-weight:800;font-size:13px}.teacher-bar-track{height:12px;background:#edf2f5;border-radius:999px;overflow:hidden;margin-top:6px}.teacher-bar-track i{display:block;height:100%;background:#0f766e;border-radius:999px}.students-report{max-width:760px;margin:20px auto 0;border-collapse:separate;border-spacing:0 6px}.students-report th{padding:10px 14px;font-size:13px}.students-report td{border:0;padding:9px 14px;background:#f7fafc}.students-report tbody tr:nth-child(even) td{background:#eef8f6}.students-report td:first-child{border-radius:0 10px 10px 0;text-align:right}.students-report td:last-child{border-radius:10px 0 0 10px;text-align:center;width:170px}.student-name{font-weight:800;color:#102a43}.report-percent{display:inline-flex;min-width:58px;justify-content:center;align-items:center;padding:5px 12px;border-radius:999px;background:#e7f5f2;color:#0f766e;font-weight:800}.students-report tbody tr:hover td{background:#fff8e8}.foot{display:flex;justify-content:space-between;gap:14px;text-align:center;margin-top:40px;padding-top:15px;border-top:1px solid #dbe4ec;font-weight:700;line-height:1.9;flex-wrap:wrap}.foot span{flex:1;min-width:150px}.head-logo{max-width:90px;max-height:90px;object-fit:contain;display:block}h2{text-align:center}@media(max-width:700px){.cards{grid-template-columns:1fr 1fr}.moe-head{flex-direction:column}}@media print{main{padding:10px}*{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}.report-svg-chart,.report-chart-svg,.report-pie-svg,.report-pie-chart-svg{break-inside:avoid;page-break-inside:avoid}.report-chart-svg text,.report-pie-chart-svg text{font-family:Cairo,Arial,sans-serif}}</style></head><body><main><div class="head">${moeHeaderBlockHTML()}<h1>منصة تعزيز السلوك الإيجابي</h1><div>${esc(SCHOOL_NAME)}</div><div>تقرير من ${esc(f.from)} إلى ${esc(f.to)}</div></div><div class="class-report-card"><span>الفصل</span><b>${esc(f.cid?state.classes.find(x=>String(x.id)===String(f.cid))?.name||"غير محدد":"جميع الفصول")}</b></div><div class="cards"><div class="card"><div class="num">${rows.length}</div>إجمالي الرصد</div><div class="card"><div class="num">${new Set(rows.map(x=>x.studentId)).size}</div>طالبات</div><div class="card"><div class="num">${counts[0]}</div>التعاون</div><div class="card"><div class="num">${counts[1]}</div>الاحترام</div></div><h2>الرسم البياني (أعمدة)</h2><div class="report-svg-chart">${reportBarSVG(counts,names)}</div><h2>التوزيع النسبي (دائري)</h2><div class="pie-wrap"><div class="report-pie-svg">${reportPieSVG(counts)}</div><div>${pieLegendHTML(counts,names)}</div></div><h2>المعلمات الأكثر رصدًا</h2><div class="teacher-report-chart">${(()=>{const m={};rows.forEach(a=>{const n=String(a.teacher||"غير محددة");m[n]=(m[n]||0)+1});const list=Object.entries(m).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],"ar"));const mx=Math.max(1,...list.map(x=>x[1]));return list.length?list.map(([name,count])=>'<div class="teacher-bar"><div class="teacher-bar-head"><span>'+esc(name)+'</span><b>'+count+' رصد</b></div><div class="teacher-bar-track"><i style="width:'+Math.round(count/mx*100)+'%"></i></div></div>').join(""):'<p>لا توجد بيانات للمعلمات.</p>'})()}</div><h2>أسماء الطالبات ونسبة الرصد</h2><table class="students-report"><thead><tr><th>اسم الطالبة</th><th>نسبة الرصد</th></tr></thead><tbody>${(()=>{const m={};rows.forEach(a=>{const n=String(a.studentName||"غير محددة");m[n]=(m[n]||0)+1});const list=Object.entries(m).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],"ar"));return list.map(([name,count],i)=>{const pct=rows.length?Math.round(count/rows.length*100):0;return `<tr><td><span class="student-name">${esc(name)}</span></td><td><span class="report-percent">${pct}%</span></td></tr>`}).join("")||'<tr><td colspan="2">لا توجد سجلات.</td></tr>'})()}</tbody></table><div class="foot"><span>الموجهة الطلابية<br><b>أ/ مها العتيبي</b></span><span><b>الأستاذة فاطمة الصعب</b></span><span>مديرة المدرسة<br><b>أ/ عبير الحربي</b></span></div></main></body></html>`}
